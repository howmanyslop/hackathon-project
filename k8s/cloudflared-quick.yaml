# A temporary HTTPS address on trycloudflare.com, for when no tunnel token
# exists yet. It needs no Cloudflare account; the address is random, changes
# whenever the pod restarts, and appears in the pod's logs, which
# `mise run k8s:deploy` prints. One copy only: each copy gets its own address.
#
# Not in kustomization.yaml: `k8s:deploy` applies either this file or
# cloudflared.yaml, depending on whether a tunnel token exists.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
  namespace: web

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      # cloudflared never calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://web.web.svc.cluster.local:80
          image: cloudflare/cloudflared:2026.10.7
          imagePullPolicy: IfNotPresent
          # /ready answers 200 once the tunnel has a connection to Cloudflare.
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - name: metrics
              containerPort: 2000
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # The image's own non-root user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      volumes:
        - name: tmp
          emptyDir: {}
