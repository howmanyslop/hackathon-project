# One Postgres server. Its password lives in the `web-postgres` Secret, which
# `mise run k8s:deploy` creates once with a random value; it is never committed.
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          env:
            - name: POSTGRES_DB
              value: web
            - name: POSTGRES_USER
              value: web
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-postgres
                  key: password
          image: postgres:18-alpine
          livenessProbe:
            exec:
              command: [pg_isready, --username=web, --dbname=web]
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, --username=web, --dbname=web]
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          # The image starts as root and drops to the postgres user itself, so
          # it keeps its default capabilities; only privilege escalation is off.
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # Postgres 18 images keep data under /var/lib/postgresql/18.
            - name: data
              mountPath: /var/lib/postgresql
      # The `local-path` volume lives on this machine, so the database stays on
      # the one that is never unplugged in the failover demo.
      nodeSelector:
        kubernetes.io/hostname: control
  # k3s's default `local-path` storage: a folder on whichever machine runs the
  # pod. Fine for a hackathon; the data is gone if that machine is.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service

metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres

spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: postgres
