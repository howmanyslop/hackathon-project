# The app: two copies, a Service in front of them, and an Ingress that sends
# every request reaching the cluster's Traefik on port 80 to that Service. No
# host rule, so no cluster address is written down in this public repository.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: web
  labels:
    app.kubernetes.io/name: web

spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://web:$(POSTGRES_PASSWORD)@postgres:5432/web
            # Elastic Cloud Serverless, for semantic search. The `web-elastic`
            # Secret is optional: `k8s:deploy` creates it only when .env has
            # both values, and the app runs without search until then.
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: web-elastic
                  key: url
                  optional: true
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: web-elastic
                  key: api-key
                  optional: true
          # `mise run k8s:deploy` replaces this tag with the commit it built.
          image: ghcr.io/howmanyslop/web:latest
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - name: http
              containerPort: 3000
          # /healthz waits for database migrations, so a copy only gets traffic
          # once the schema is current.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # Keep the two copies on different machines when possible.
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
---
apiVersion: v1
kind: Service

metadata:
  name: web
  labels:
    app.kubernetes.io/name: web

spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: web
  labels:
    app.kubernetes.io/name: web

spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - backend:
              service:
                name: web
                port:
                  name: http
            path: /
            pathType: Prefix
