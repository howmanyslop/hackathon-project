[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]

# The team's k3s cluster, reached over Tailscale. Everyone saves the login file
# at this path, so kubectl in this repository can't hit some other cluster.
KUBECONFIG = "{{env.HOME}}/.kube/hackathon.yaml"

HK_MISE = 1
HK_JOBS = 2

[settings]
experimental = true
auto_install = false
lockfile = true
minimum_release_age_excludes = ["aube", "codex", "pnpm", "hk"]
provenance_api_failures_fatal = false
cargo.binstall_native = true

[tools]
"github:blopker/codebook" = "latest"
# fish 4 ships a single binary on Linux; fish_indent is a builtin inside it.
# macOS installs fish separately (Homebrew), since the release only has a .pkg.
"github:fish-shell/fish-shell" = { version = "latest", os = ["linux"] }
"pipx:sqlfluff" = "latest"
betterleaks = "latest"
bun = "latest"
container = { version = "latest", os = ["macos/arm64"] }
direnv = "latest"
harper-cli = "2.9.1"
hk = { version = "2.11.1", workflow = "release.yml" }
jactionlint = "latest"
kubectl = "latest"
ni = "latest"
node = "26"
pinact = "latest"
pkl = "latest"
pnpm = "12.18.0"
python = "3.14.7"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
uv = "latest"
vale = "latest"

[tasks]
[tasks."amend:verify"]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff"

[tasks."commit:no-verify"]
description = "Commits the staged changes without running Git hooks."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}" --no-verify
"""

[tasks."k8s:deploy"]
description = "Builds the web image, pushes it to ghcr.io, and deploys it to the team cluster."
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ ! -f "${KUBECONFIG:-}" ]]; then
	echo "No cluster login at ${KUBECONFIG:-~/.kube/hackathon.yaml}. Get it from the owner of the control machine." >&2
	exit 1
fi

image="ghcr.io/howmanyslop/web"
tag="$(git rev-parse --short HEAD)"
if ! git diff --quiet HEAD -- || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
	tag="${tag}-dirty-$(date +%Y%m%d%H%M%S)"
fi

# The image is public, so check the app's files before anything is pushed:
# known secret formats (betterleaks), plus Tailscale names and addresses.
echo "==> Scanning the image's app files for secrets"
scan="$(mktemp -d)"
trap 'rm -rf "${scan}"' EXIT
docker buildx build --platform linux/amd64 --file apps/web/Dockerfile --target app-files --output "type=local,dest=${scan}" --quiet . > /dev/null
if ! betterleaks dir "${scan}" --no-banner --redact --log-level warn; then
	echo "Refusing to push: betterleaks found a secret in the build output (above). Remove it from the source or .env files." >&2
	exit 1
fi
if grep -r -l -E 'tail[0-9a-f]+\.ts\.net|\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b' "${scan}"; then
	echo "Refusing to push: the files above contain a Tailscale hostname or address." >&2
	exit 1
fi

echo "==> Building and pushing ${image}:${tag} (linux/amd64)"
if ! docker buildx build --platform linux/amd64 --file apps/web/Dockerfile --tag "${image}:${tag}" --push .; then
	echo "Build or push failed. If the push was refused, run: gh auth token | docker login ghcr.io -u <github-user> --password-stdin" >&2
	exit 1
fi

echo "==> Applying k8s/ to the web namespace"
kubectl apply --filename k8s/namespace.yaml
if ! kubectl --namespace web get secret web-postgres > /dev/null 2>&1; then
	kubectl --namespace web create secret generic web-postgres --from-literal=password="$(openssl rand -hex 24)"
fi
kubectl kustomize k8s | sed "s|${image}:latest|${image}:${tag}|" | kubectl apply --filename -

echo "==> Waiting for the rollout"
kubectl --namespace web rollout status statefulset/postgres --timeout=180s
for _ in $(seq 1 60); do
	if kubectl --namespace web rollout status deployment/web --timeout=5s > /dev/null 2>&1; then
		break
	fi
	# A pod that can't download the image never recovers on its own, so say so now.
	if kubectl --namespace web get pods --selector app.kubernetes.io/name=web --output jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' | grep -q -E 'ImagePullBackOff|ErrImagePull'; then
		echo "The cluster can't download ${image}:${tag}. Make the package public: https://github.com/orgs/howmanyslop/packages/container/web/settings" >&2
		exit 1
	fi
done
kubectl --namespace web rollout status deployment/web --timeout=5s

# The address comes from the local kubeconfig, never from this repository.
host="$(kubectl config view --minify --output jsonpath='{.clusters[0].cluster.server}' | sed -E 's|^https?://||; s|:[0-9]+$||')"
echo "==> Deployed ${tag}: http://${host}"
'''

[tasks."k8s:logs"]
description = "Follows the web app's logs from every pod in the cluster."
run = "kubectl --namespace web logs --follow --prefix --selector app.kubernetes.io/name=web"

[tasks."k8s:status"]
description = "Shows what's running in the web namespace and on which machine."
run = "kubectl --namespace web get pods,services,ingresses,persistentvolumeclaims --output wide"

[tasks.amend]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff --no-verify"

[tasks.commit]
description = "Commits the staged changes."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}"
"""

[tasks.init]
description = "Turns a copy of this template into a new project (rename, fresh git, install)."
usage = """
arg <name> {
	help "Project name, kebab-case"
}
flag "--agents" help="Keep the agent setup without asking"
flag "--no-agents" help="Remove the agent setup without asking"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
choice=""
if [[ "${usage_agents:-}" == "true" ]]; then choice="--agents"; fi
if [[ "${usage_no_agents:-}" == "true" ]]; then choice="--no-agents"; fi
bash scripts/init-project.sh "${usage_name?}" ${choice}
"""

[tasks.lint-configuration]
description = "View the lint configuration."
usage = '''
arg "<type>" {
	help "What linting configuration do you want to run the inspector for?"
	choices "eslint" "oxlint"
}
'''
run = '''
#!/usr/bin/env bash

set -euo pipefail

case "${usage_type?}" in
	eslint)
		nlx @eslint/config-inspector
		;;
	oxlint)
		nlx oxlint-config-inspector
		;;
esac
'''

[tasks.sync]
description = "Pulls tooling changes from ~/GitHub/voice, showing the diff before applying it."
usage = """
arg "[personal]" {
	help "Path to the personal-site repository"
	default "~/GitHub/voice"
}
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
bash scripts/sync-from-personal.sh "${usage_personal/#\\~/$HOME}"
"""
