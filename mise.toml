[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]

# The team's k3s cluster, reached over Tailscale. Everyone saves the login file
# at this path, so kubectl in this repository can't hit some other cluster.
KUBECONFIG = "{{env.HOME}}/.kube/hackathon.yaml"

HK_MISE = 1
HK_JOBS = 2

[settings]
experimental = true
auto_install = false
lockfile = true
minimum_release_age_excludes = ["aube", "codex", "pnpm", "hk"]
provenance_api_failures_fatal = false
cargo.binstall_native = true

[tools]
"github:blopker/codebook" = "latest"
# fish 4 ships a single binary on Linux; fish_indent is a builtin inside it.
# macOS installs fish separately (Homebrew), since the release only has a .pkg.
"github:fish-shell/fish-shell" = { version = "latest", os = ["linux"] }
"github:skyhook-io/radar" = "latest"
"pipx:sqlfluff" = "latest"
betterleaks = "latest"
bun = "latest"
container = { version = "latest", os = ["macos/arm64"] }
direnv = "latest"
harper-cli = "2.9.1"
helm = "latest"
hk = { version = "2.11.1", workflow = "release.yml" }
jactionlint = "latest"
kubectl = "latest"
ni = "latest"
node = "26"
pinact = "latest"
pkl = "latest"
pnpm = "12.18.0"
python = "3.14.7"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
uv = "latest"
vale = "latest"

[tasks]
[tasks."amend:verify"]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff"

[tasks."commit:no-verify"]
description = "Commits the staged changes without running Git hooks."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}" --no-verify
"""

[tasks."dash0:down"]
description = "Stops sending telemetry to Dash0 and removes the Dash0 operator from the cluster."
run = '''
#!/usr/bin/env bash
set -euo pipefail
kubectl delete --filename k8s/dash0/monitoring.yaml --ignore-not-found
# Uninstalling the operator also removes its instrumentation from the app.
helm uninstall dash0-operator --namespace dash0-system --wait --ignore-not-found
kubectl delete namespace dash0-system --ignore-not-found
'''

[tasks."dash0:install"]
description = "Installs the Dash0 operator and sends the app's traces, logs, and metrics to Dash0."
run = '''
#!/usr/bin/env bash
set -euo pipefail

for name in DASH0_ENDPOINT DASH0_API_ENDPOINT DASH0_AUTH_TOKEN; do
	if [[ -z "${!name:-}" ]]; then
		echo "Set ${name} in .env first; .env.example says where each value comes from." >&2
		exit 1
	fi
done

# The token lives in a Secret, not in Helm values, which end up in a ConfigMap.
echo "==> Storing the Dash0 token in the dash0-system namespace"
kubectl create namespace dash0-system --dry-run=client --output yaml | kubectl apply --filename - > /dev/null
kubectl --namespace dash0-system create secret generic dash0-authorization-secret \
	--from-file=token=<(printf '%s' "${DASH0_AUTH_TOKEN}") \
	--dry-run=client --output yaml | kubectl apply --filename - > /dev/null

echo "==> Installing the Dash0 operator"
helm repo add dash0-operator https://dash0hq.github.io/dash0-operator --force-update > /dev/null
helm upgrade dash0-operator dash0-operator/dash0-operator \
	--install --wait \
	--namespace dash0-system \
	--version 0.159.0 \
	--set operator.dash0Export.enabled=true \
	--set operator.dash0Export.endpoint="${DASH0_ENDPOINT}" \
	--set operator.dash0Export.apiEndpoint="${DASH0_API_ENDPOINT}" \
	--set operator.dash0Export.secretRef.name=dash0-authorization-secret \
	--set operator.dash0Export.secretRef.key=token \
	--set operator.clusterName=hackathon

echo "==> Monitoring the web namespace (this restarts the app's pods once)"
kubectl apply --filename k8s/namespace.yaml > /dev/null
kubectl apply --filename k8s/dash0/monitoring.yaml
echo "==> Done. Traces, logs, and metrics show up in https://app.dash0.com within a few minutes."
'''

[tasks."elastic:setup"]
description = "Creates or updates the Elastic indices, Agent Builder tools and agent, and the digest workflow."
usage = """
flag "--run-workflow" help="Run the digest workflow once afterwards"
"""
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ "${usage_run_workflow:-}" == "true" ]]; then
	bun run scripts/set-up-elastic.ts --run-workflow
else
	bun run scripts/set-up-elastic.ts
fi
'''

[tasks."k8s:db"]
description = "Connects localhost:5432 to the cluster's Postgres until you press Ctrl+C."
run = '''
#!/usr/bin/env bash
set -euo pipefail
password="$(kubectl --namespace web get secret web-postgres --output jsonpath='{.data.password}' | base64 --decode)"
echo "In another terminal, for db:studio or node --run dev against the cluster's data:"
echo
echo "  export DATABASE_URL=postgres://web:${password}@localhost:5432/web"
echo
echo "Stop any local Postgres on port 5432 first. Press Ctrl+C here to disconnect."
kubectl --namespace web port-forward service/postgres 5432:5432
'''

[tasks."k8s:deploy"]
description = "Builds the web image, pushes it to ghcr.io, and deploys it to the team cluster."
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ ! -f "${KUBECONFIG:-}" ]]; then
	echo "No cluster login at ${KUBECONFIG:-~/.kube/hackathon.yaml}. Get it from the owner of the control machine." >&2
	exit 1
fi

image="ghcr.io/howmanyslop/web"
tag="$(git rev-parse --short HEAD)"
if ! git diff --quiet HEAD -- || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
	tag="${tag}-dirty-$(date +%Y%m%d%H%M%S)"
fi

# The image is public, so check the app's files before anything is pushed:
# known secret formats (betterleaks), plus Tailscale names and addresses.
echo "==> Scanning the image's app files for secrets"
scan="$(mktemp -d)"
trap 'rm -rf "${scan}"' EXIT
docker buildx build --platform linux/amd64 --file apps/web/Dockerfile --target app-files --output "type=local,dest=${scan}" --quiet . > /dev/null
if ! betterleaks dir "${scan}" --no-banner --redact --log-level warn; then
	echo "Refusing to push: betterleaks found a secret in the build output (above). Remove it from the source or .env files." >&2
	exit 1
fi
if grep -r -l -E 'tail[0-9a-f]+\.ts\.net|\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b' "${scan}"; then
	echo "Refusing to push: the files above contain a Tailscale hostname or address." >&2
	exit 1
fi

echo "==> Building and pushing ${image}:${tag} (linux/amd64)"
if ! docker buildx build --platform linux/amd64 --file apps/web/Dockerfile --tag "${image}:${tag}" --push .; then
	echo "Build or push failed. If the push was refused, run: gh auth token | docker login ghcr.io -u <github-user> --password-stdin" >&2
	exit 1
fi

echo "==> Applying k8s/ to the web namespace"
kubectl apply --filename k8s/namespace.yaml
if ! kubectl --namespace web get secret web-postgres > /dev/null 2>&1; then
	kubectl --namespace web create secret generic web-postgres --from-literal=password="$(openssl rand -hex 24)"
fi

# Prints a Secret's data, or nothing when it doesn't exist, to tell whether
# this run changed it.
read_secret() {
	kubectl --namespace web get secret "$1" --output jsonpath='{.data}' 2> /dev/null || true
}

# Secret values go through files in a private folder, never the command line:
# `put_secret_value <secret> <key> <value>` writes one, `apply_secret
# <secret>` creates or updates the Secret from every value written for it.
secret_values="$(mktemp -d)"
trap 'rm -rf "${scan}" "${secret_values}"' EXIT
put_secret_value() {
	mkdir -p "${secret_values}/$1"
	printf '%s' "$3" > "${secret_values}/$1/$2"
}
apply_secret() {
	kubectl --namespace web create secret generic "$1" --from-file="${secret_values}/$1" \
		--dry-run=client --output yaml | kubectl apply --filename - > /dev/null
}

# The shared presenter code: random, made once, never printed.
presenter_before="$(read_secret web-presenter)"
if [[ -z "${presenter_before}" ]]; then
	kubectl --namespace web create secret generic web-presenter --from-literal=code="$(openssl rand -hex 4)"
	echo "==> Created a presenter code. Read it with: kubectl --namespace web get secret web-presenter --output jsonpath='{.data.code}' | base64 --decode"
fi
presenter_after="$(read_secret web-presenter)"

# Search and the Ask box are optional. With both Elastic values in .env, copy
# them (and KIBANA_URL, when set) into the `web-elastic` Secret.
elastic_before="$(read_secret web-elastic)"
if [[ -n "${ELASTICSEARCH_URL:-}" && -n "${ELASTICSEARCH_API_KEY:-}" ]]; then
	put_secret_value web-elastic url "${ELASTICSEARCH_URL}"
	put_secret_value web-elastic api-key "${ELASTICSEARCH_API_KEY}"
	if [[ -n "${KIBANA_URL:-}" ]]; then
		put_secret_value web-elastic kibana-url "${KIBANA_URL}"
	fi
	apply_secret web-elastic
elif [[ -n "${ELASTICSEARCH_URL:-}${ELASTICSEARCH_API_KEY:-}" ]]; then
	echo "Set both ELASTICSEARCH_URL and ELASTICSEARCH_API_KEY in .env, or neither." >&2
	exit 1
elif [[ -z "${elastic_before}" ]]; then
	echo "==> No Elastic values in .env; deploying without search"
fi
elastic_after="$(read_secret web-elastic)"

# OpenRouter, the fallback model for splitting talks into questions and
# answers. Optional: only when OPENROUTER_API_KEY is set.
llm_before="$(read_secret web-llm)"
if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
	put_secret_value web-llm api-key "${OPENROUTER_API_KEY}"
	if [[ -n "${OPENROUTER_MODEL:-}" ]]; then
		put_secret_value web-llm model "${OPENROUTER_MODEL}"
	fi
	apply_secret web-llm
fi
llm_after="$(read_secret web-llm)"

# The Cloudflare Tunnel token, from the tunnel's page in the Cloudflare
# dashboard. Without one, a temporary trycloudflare.com address is used.
tunnel_before="$(read_secret web-tunnel)"
if [[ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]]; then
	put_secret_value web-tunnel token "${CLOUDFLARE_TUNNEL_TOKEN}"
	apply_secret web-tunnel
fi
tunnel_after="$(read_secret web-tunnel)"

kubectl kustomize k8s | sed "s|${image}:latest|${image}:${tag}|" | kubectl apply --filename -

# Once `dash0:install` has run, keep monitoring on, even after `k8s:down`.
if kubectl get crd dash0monitorings.operator.dash0.com > /dev/null 2>&1; then
	kubectl apply --filename k8s/dash0/monitoring.yaml
fi

# Pods read Secrets only when they start, so restart them if the keys changed.
if [[ "${elastic_before}" != "${elastic_after}" || "${presenter_before}" != "${presenter_after}" || "${llm_before}" != "${llm_after}" ]]; then
	echo "==> Secrets changed; restarting the app to pick them up"
	kubectl --namespace web rollout restart deployment/web
fi

echo "==> Waiting for the rollout"
kubectl --namespace web rollout status statefulset/postgres --timeout=180s
for _ in $(seq 1 60); do
	if kubectl --namespace web rollout status deployment/web --timeout=5s > /dev/null 2>&1; then
		break
	fi
	# A pod that can't download the image never recovers on its own, so say so now.
	if kubectl --namespace web get pods --selector app.kubernetes.io/name=web --output jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' | grep -q -E 'ImagePullBackOff|ErrImagePull'; then
		echo "The cluster can't download ${image}:${tag}. Make the package public: https://github.com/orgs/howmanyslop/packages/container/web/settings" >&2
		exit 1
	fi
done
kubectl --namespace web rollout status deployment/web --timeout=5s

# The address comes from the local kubeconfig, never from this repository.
host="$(kubectl config view --minify --output jsonpath='{.clusters[0].cluster.server}' | sed -E 's|^https?://||; s|:[0-9]+$||')"
echo "==> Deployed ${tag}: http://${host}"

# HTTPS through a Cloudflare Tunnel: the named tunnel when a token exists,
# otherwise a temporary trycloudflare.com address.
if [[ -n "${tunnel_after}" ]]; then
	echo "==> Starting the Cloudflare Tunnel"
	kubectl apply --filename k8s/cloudflared.yaml
	if [[ -n "${tunnel_before}" && "${tunnel_before}" != "${tunnel_after}" ]]; then
		kubectl --namespace web rollout restart deployment/cloudflared
	fi
	kubectl --namespace web rollout status deployment/cloudflared --timeout=120s
	echo "==> HTTPS: the hostname routed to this tunnel in the Cloudflare dashboard"
else
	echo "==> No CLOUDFLARE_TUNNEL_TOKEN; starting a temporary trycloudflare.com tunnel"
	kubectl apply --filename k8s/cloudflared-quick.yaml
	kubectl --namespace web rollout status deployment/cloudflared --timeout=120s
	address=""
	for _ in $(seq 1 30); do
		address="$(kubectl --namespace web logs deployment/cloudflared 2> /dev/null | grep -o -E 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -n 1 || true)"
		if [[ -n "${address}" ]]; then
			break
		fi
		sleep 2
	done
	if [[ -n "${address}" ]]; then
		echo "==> HTTPS: ${address} (changes whenever the cloudflared pod restarts)"
	else
		echo "==> No trycloudflare.com address yet; see: kubectl --namespace web logs deployment/cloudflared" >&2
	fi
fi
'''

[tasks."k8s:down"]
description = "Deletes the app and its database from the cluster, after asking."
run = '''
#!/usr/bin/env bash
set -euo pipefail
read -r -p "Delete the web namespace, including every talk in the database? Type 'delete' to confirm: " answer
if [[ "${answer}" != "delete" ]]; then
	echo "Nothing deleted."
	exit 0
fi
kubectl delete namespace web
echo "Deleted. mise run k8s:deploy creates it again, with an empty database."
'''

[tasks."k8s:logs"]
description = "Follows the web app's logs from every pod in the cluster."
run = "kubectl --namespace web logs --follow --prefix --selector app.kubernetes.io/name=web"

[tasks."k8s:status"]
description = "Shows what's running in the web namespace and on which machine."
run = "kubectl --namespace web get pods,services,ingresses,persistentvolumeclaims --output wide"

[tasks.amend]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff --no-verify"

[tasks.commit]
description = "Commits the staged changes."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}"
"""

[tasks.init]
description = "Turns a copy of this template into a new project (rename, fresh git, install)."
usage = """
arg <name> {
	help "Project name, kebab-case"
}
flag "--agents" help="Keep the agent setup without asking"
flag "--no-agents" help="Remove the agent setup without asking"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
choice=""
if [[ "${usage_agents:-}" == "true" ]]; then choice="--agents"; fi
if [[ "${usage_no_agents:-}" == "true" ]]; then choice="--no-agents"; fi
bash scripts/init-project.sh "${usage_name?}" ${choice}
"""

[tasks.lint-configuration]
description = "View the lint configuration."
usage = '''
arg "<type>" {
	help "What linting configuration do you want to run the inspector for?"
	choices "eslint" "oxlint"
}
'''
run = '''
#!/usr/bin/env bash

set -euo pipefail

case "${usage_type?}" in
	eslint)
		nlx @eslint/config-inspector
		;;
	oxlint)
		nlx oxlint-config-inspector
		;;
esac
'''

[tasks.seed]
description = "Records the sample talks in apps/web/seed/ through the app's own procedures. Safe to run twice."
usage = """
arg <base-url> {
	help "The app's address, such as https://asked.howmanysmall.com or http://localhost:3000"
}
"""
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -z "${PRESENTER_CODE:-}" ]]; then
	PRESENTER_CODE="$(kubectl --namespace web get secret web-presenter --output jsonpath='{.data.code}' | base64 --decode)"
fi
export PRESENTER_CODE
node apps/web/scripts/seed-archive.ts "${usage_base_url?}"
'''

[tasks.sync]
description = "Pulls tooling changes from ~/GitHub/voice, showing the diff before applying it."
usage = """
arg "[personal]" {
	help "Path to the personal-site repository"
	default "~/GitHub/voice"
}
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
bash scripts/sync-from-personal.sh "${usage_personal/#\\~/$HOME}"
"""
